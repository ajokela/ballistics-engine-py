[package]
name = "ballistics-engine-py"
version = "0.33.1"
edition = "2021"
authors = ["Alex Jokela <email@tinycomputers.io>"]
description = "Python bindings for ballistics-engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ajokela/ballistics-engine-py"

[lib]
name = "ballistics_engine_py"
crate-type = ["cdylib"]

[dependencies]
ballistics-engine = { version = "0.33.1", default-features = false }
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py38", "generate-import-lib"] }
numpy = "0.26"
nalgebra = "0.35"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
